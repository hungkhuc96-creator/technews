name: Test (CI)

# Chạy toàn bộ test + typecheck mỗi lần push/PR — chặn "đỏ mà vẫn deploy".
on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Test tích hợp chạy trên DB TEST riêng (project "hot tech news TEST"), KHÔNG
      # phải production — vitest.setup.ts từ chối chạy nếu thiếu 2 biến _TEST này.
      # CI cố tình KHÔNG có secret production → không đường nào chạm tới dữ liệu thật.
      # KHÔNG cần ANTHROPIC_API_KEY — mọi test dùng chat giả.
      - name: Tạo .env.local
        run: |
          cat > .env.local <<EOF
          SUPABASE_URL_TEST=${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_KEY_TEST=${{ secrets.SUPABASE_SERVICE_KEY_TEST }}
          EOF

      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
