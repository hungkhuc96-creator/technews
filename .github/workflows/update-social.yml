name: Cập nhật X + YouTube (mỗi 4h)

# X (tốn credit Apify) + YouTube giữ nhịp thưa để tiết kiệm chi phí.
on:
  schedule:
    - cron: '0 */4 * * *'   # mỗi 4 giờ
  workflow_dispatch: {}

concurrency:
  group: update-social
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write   # để bước báo lỗi tạo/ghi GitHub Issue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tạo .env.local
        run: |
          cat > .env.local <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN=${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - run: npm install --no-audit --no-fund
      - run: npm run ingest:youtube    # YouTube (kèm dịch tiêu đề)

      - name: Tóm tắt sẵn ý chính video mới (bỏ qua podcast dài)
        continue-on-error: true        # Gemini lỗi/hết hạn mức không chặn ingest
        run: npm run summarize:videos

      - name: Nạp X (Apify)
        continue-on-error: true        # X lỗi không chặn các bước trên
        run: npm run ingest:x

      - name: Nạp Hacker News (Algolia, miễn phí)
        continue-on-error: true        # nguồn phụ — lỗi không chặn workflow
        run: npm run ingest:hn

      - name: Nạp Reddit (RSS công khai)
        continue-on-error: true        # RSS Reddit có thể chặn IP datacenter — theo dõi lượt đầu
        run: npm run ingest:reddit

      - name: Dịch bù tiêu đề X/YouTube kẹt tiếng Anh (ingest lúc hết credit)
        continue-on-error: true        # hết credit/lỗi dịch không chặn workflow
        run: npm run backfill:titles

      # Chỉ chạy khi bước KHÔNG-continue-on-error hỏng (vd YouTube crash).
      # X/Gemini để continue-on-error nên lỗi lẻ của chúng không kích cảnh báo.
      - name: Báo lỗi qua GitHub Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Lại hỏng — \`${context.workflow}\` — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Pipeline hỏng — cần kiểm tra',
                labels: [label],
                body: `Workflow **${context.workflow}** vừa hỏng.\n\nXem log: ${runUrl}\n\nSửa xong hãy **đóng issue này**; lần hỏng sau sẽ mở issue mới.`,
              });
            }
