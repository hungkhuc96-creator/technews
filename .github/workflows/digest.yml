name: Bản tin Telegram (7h·12h·16h·19h VN)

# Gửi bản tin 5 tin nóng nhất vào kênh Telegram, 4 lần/ngày.
# Nhờ digest_log (chống lặp 7 ngày), mỗi bản tự lấy 5 tin MỚI khác bản trước.
#
# ĐÚNG GIỜ = cron-job.org gọi /api/cron?wf=digest tại 7:00/12:00/16:00/19:00 VN
# (lịch GitHub trễ 5-30' là thường). Lịch dưới đây là DỰ PHÒNG, đặt 20' SAU giờ
# đích: nếu cron-job.org đã gửi thì script tự bỏ qua (chốt chặn 90' trong
# digest.ts); pinger chết thì bản tin vẫn tới, chỉ muộn ~20-50'.
# LƯU Ý: tránh phút 0 — cron GitHub lúc "giờ chẵn" (nhất là 00:00 UTC) nghẽn toàn
# cầu, job có thể bị TRỄ 30'+ hoặc BỎ QUA HẲN (đã xảy ra: bản sáng 4/7 không gửi).
on:
  schedule:
    - cron: '20 0 * * *'   # 00:20 UTC = 07:20 VN (dự phòng bản 7h)
    - cron: '20 5 * * *'   # 05:20 UTC = 12:20 VN (dự phòng bản 12h)
    - cron: '20 9 * * *'   # 09:20 UTC = 16:20 VN (dự phòng bản 16h)
    - cron: '20 12 * * *'  # 12:20 UTC = 19:20 VN (dự phòng bản 19h)
  workflow_dispatch: {}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write   # để bước báo lỗi tạo/ghi GitHub Issue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tạo .env.local
        run: |
          cat > .env.local <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}
          EOF

      - run: npm install --no-audit --no-fund
      - run: npm run digest

      - name: Báo lỗi qua GitHub Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Lại hỏng — \`${context.workflow}\` — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Pipeline hỏng — cần kiểm tra',
                labels: [label],
                body: `Workflow **${context.workflow}** vừa hỏng.\n\nXem log: ${runUrl}\n\nSửa xong hãy **đóng issue này**; lần hỏng sau sẽ mở issue mới.`,
              });
            }
